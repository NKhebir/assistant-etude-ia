# Lance une base PostgreSQL avec pgvector déjà installé :  docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - donnees:/var/lib/postgresql/data
volumes:
  donnees:
